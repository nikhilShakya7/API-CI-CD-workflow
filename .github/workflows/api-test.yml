name: API QA Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jsonplaceholder.typicode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test
