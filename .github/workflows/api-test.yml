name: API Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: echo "BASE_URL=${{ vars.BASE_URL || 'https://jsonplaceholder.typicode.com' }}" > .env

      - name: Run Newman
        run: npm test